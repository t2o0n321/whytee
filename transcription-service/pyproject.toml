[project]
name = "yt-transcription-service"
version = "0.1.0"
description = "Tiered-fallback YouTube transcription microservice for the n8n / OpenRouter / Supabase channel-analysis architecture"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    # Pin to the 1.x line: the provider uses the instance API (api.list / fetch)
    # introduced in 1.0, which is incompatible with the 0.6.x classmethods.
    "youtube-transcript-api>=1.0,<2",
    "yt-dlp>=2024.4.9",
    "faster-whisper>=1.0.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, flake8-bugbear, flake8-blind-except
select = ["E", "F", "I", "UP", "B", "BLE"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]
