[project]
name = "yt-transcription-service"
version = "0.1.0"
description = "Tiered-fallback YouTube transcription microservice for the n8n / OpenRouter / Supabase channel-analysis architecture"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "youtube-transcript-api>=0.6.2",
    "yt-dlp>=2024.4.9",
    "faster-whisper>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
